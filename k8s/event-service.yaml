apiVersion: v1
kind: Service

metadata:
  name: event-service
  namespace: fincompliance

spec:
  selector:
    app: event-service

  ports:
    - name: http
      port: 3001
      targetPort: 3001

---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: event-service
  namespace: fincompliance

spec:
  replicas: 1

  strategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app: event-service

  template:
    metadata:
      labels:
        app: event-service

    spec:
      containers:
        - name: event-service

          image: fincompliance/event-service:phase12

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3001

          envFrom:
            - configMapRef:
                name: fincompliance-config

            - secretRef:
                name: fincompliance-secrets

          readinessProbe:
            httpGet:
              path: /health
              port: 3001

            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 3001

            initialDelaySeconds: 20
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
