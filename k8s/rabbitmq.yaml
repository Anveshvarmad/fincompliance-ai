apiVersion: v1
kind: Service

metadata:
  name: rabbitmq
  namespace: fincompliance

spec:
  selector:
    app: rabbitmq

  ports:
    - name: amqp
      port: 5672
      targetPort: 5672

    - name: management
      port: 15672
      targetPort: 15672

---

apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: rabbitmq
  namespace: fincompliance

spec:
  serviceName: rabbitmq

  replicas: 1

  selector:
    matchLabels:
      app: rabbitmq

  template:
    metadata:
      labels:
        app: rabbitmq

    spec:
      containers:
        - name: rabbitmq

          image: rabbitmq:3-management-alpine

          ports:
            - containerPort: 5672
            - containerPort: 15672

          env:
            - name: RABBITMQ_DEFAULT_USER

              valueFrom:
                secretKeyRef:
                  name: fincompliance-secrets
                  key: RABBITMQ_USER

            - name: RABBITMQ_DEFAULT_PASS

              valueFrom:
                secretKeyRef:
                  name: fincompliance-secrets
                  key: RABBITMQ_PASSWORD

          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping

            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping

            initialDelaySeconds: 30
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"

            limits:
              cpu: "750m"
              memory: "768Mi"

          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq

  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 1Gi
