apiVersion: v1
kind: Service

metadata:
  name: frontend
  namespace: fincompliance

spec:
  selector:
    app: frontend

  ports:
    - name: http
      port: 5173
      targetPort: 5173

---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: fincompliance

spec:
  replicas: 2

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: fincompliance/frontend:phase12

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5173

          readinessProbe:
            httpGet:
              path: /
              port: 5173

            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 5173

            initialDelaySeconds: 20
            periodSeconds: 10

          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

---

apiVersion: policy/v1
kind: PodDisruptionBudget

metadata:
  name: frontend-pdb
  namespace: fincompliance

spec:
  minAvailable: 1

  selector:
    matchLabels:
      app: frontend
