apiVersion: v1
kind: ConfigMap

metadata:
  name: fincompliance-config
  namespace: fincompliance

data:
  LOG_LEVEL: "INFO"

  RATE_LIMIT_PER_MINUTE: "300"

  JWT_ALGORITHM: "HS256"
  JWT_EXPIRE_MINUTES: "60"
  AUTH_ISSUER: "fincompliance-ai"

  MONGO_DB: "fincompliance"

  RABBITMQ_QUEUE: "compliance.audit.events"

  OUTBOX_ENABLED: "true"

  EVENT_SERVICE_URL: "http://event-service:3001"

  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"

  OLLAMA_BASE_URL: "http://host.docker.internal:11434"

  OLLAMA_MODEL: "gemma3:4b"

  OLLAMA_EMBEDDING_MODEL: "embeddinggemma"
