apiVersion: v1
kind: Service

metadata:
  name: chroma
  namespace: fincompliance

spec:
  selector:
    app: chroma

  ports:
    - name: http
      port: 8000
      targetPort: 8000

---

apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: chroma
  namespace: fincompliance

spec:
  serviceName: chroma

  replicas: 1

  selector:
    matchLabels:
      app: chroma

  template:
    metadata:
      labels:
        app: chroma

    spec:
      containers:
        - name: chroma

          image: chromadb/chroma:latest

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:
            - name: IS_PERSISTENT
              value: "TRUE"

            - name: PERSIST_DIRECTORY
              value: "/chroma/chroma"

          readinessProbe:
            tcpSocket:
              port: 8000

            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: 8000

            initialDelaySeconds: 30
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"

            limits:
              cpu: "750m"
              memory: "1Gi"

          volumeMounts:
            - name: chroma-data
              mountPath: /chroma/chroma

  volumeClaimTemplates:
    - metadata:
        name: chroma-data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 2Gi
